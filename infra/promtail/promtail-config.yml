server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:

      # 1. Filtra para pegar apenas o serviço 'backend' do compose
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        regex: backend
        action: keep
      
      # 2. Define o service_name usando o nome do serviço compose
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service_name
      
      # 3. Adiciona o nome do container para ajudar no debug
      - source_labels: [__meta_docker_container_name]
        target_label: container
